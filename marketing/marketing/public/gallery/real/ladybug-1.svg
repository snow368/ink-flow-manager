<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ladybug tattoo design">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#16213a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="18" fill="none" stroke="#a3e635" stroke-width="2" opacity="0.9"/>
  <rect x="30" y="30" width="452" height="452" rx="12" fill="none" stroke="#a3e635" stroke-width="1" opacity="0.35"/>
  <text x="256" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="3" fill="#a3e635" opacity="0.85">TATTOO MEANING</text>
  <circle cx="256" cy="300" r="160" fill="url(#glow)"/>
  <!-- legs -->
  <g stroke="#111827" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M122 272 L88 250"/><path d="M116 312 L82 312"/><path d="M126 352 L92 372"/>
    <path d="M390 272 L424 250"/><path d="M396 312 L430 312"/><path d="M386 352 L420 372"/>
  </g>
  <!-- antennae -->
  <g stroke="#111827" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M230 150 L206 116"/><path d="M282 150 L306 116"/>
  </g>
  <circle cx="206" cy="114" r="8" fill="#111827"/>
  <circle cx="306" cy="114" r="8" fill="#111827"/>
  <!-- body -->
  <ellipse cx="256" cy="300" rx="140" ry="125" fill="#ef4444" stroke="#111827" stroke-width="5"/>
  <!-- head -->
  <ellipse cx="256" cy="188" rx="82" ry="50" fill="#111827"/>
  <!-- center seam -->
  <line x1="256" y1="198" x2="256" y2="420" stroke="#111827" stroke-width="6"/>
  <!-- spots -->
  <g fill="#111827">
    <circle cx="206" cy="282" r="21"/><circle cx="190" cy="346" r="17"/><circle cx="236" cy="380" r="15"/>
    <circle cx="306" cy="282" r="21"/><circle cx="322" cy="346" r="17"/><circle cx="276" cy="380" r="15"/>
  </g>
  <!-- dome highlight -->
  <ellipse cx="210" cy="262" rx="34" ry="22" fill="#ffffff" opacity="0.18"/>
  <text x="256" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" letter-spacing="2" fill="#f8fafc">LADYBUG</text>
  <text x="256" y="476" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="2" fill="#ecfccb">INSECTS</text>
</svg>
