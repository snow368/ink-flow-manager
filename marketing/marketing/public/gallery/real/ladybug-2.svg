<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ladybug line-art tattoo design">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#16213a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="18" fill="none" stroke="#a3e635" stroke-width="2" opacity="0.9"/>
  <rect x="30" y="30" width="452" height="452" rx="12" fill="none" stroke="#a3e635" stroke-width="1" opacity="0.35"/>
  <text x="256" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="3" fill="#a3e635" opacity="0.85">TATTOO MEANING</text>
  <circle cx="256" cy="300" r="160" fill="url(#glow)"/>
  <!-- legs -->
  <g stroke="#d9f99d" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M126 276 L94 256"/><path d="M120 314 L88 314"/><path d="M130 350 L98 370"/>
    <path d="M386 276 L418 256"/><path d="M392 314 L424 314"/><path d="M382 350 L414 370"/>
  </g>
  <!-- antennae -->
  <g stroke="#d9f99d" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M232 152 L210 120"/><path d="M280 152 L302 120"/>
  </g>
  <circle cx="210" cy="118" r="7" fill="#d9f99d"/>
  <circle cx="302" cy="118" r="7" fill="#d9f99d"/>
  <!-- body outline -->
  <ellipse cx="256" cy="302" rx="132" ry="120" fill="none" stroke="#d9f99d" stroke-width="5"/>
  <!-- head outline -->
  <ellipse cx="256" cy="190" rx="76" ry="46" fill="none" stroke="#d9f99d" stroke-width="5"/>
  <!-- center seam -->
  <line x1="256" y1="200" x2="256" y2="416" stroke="#d9f99d" stroke-width="5"/>
  <!-- spots (outline) -->
  <g fill="none" stroke="#d9f99d" stroke-width="4">
    <circle cx="212" cy="286" r="22"/><circle cx="198" cy="348" r="18"/>
    <circle cx="300" cy="286" r="22"/><circle cx="314" cy="348" r="18"/>
  </g>
  <text x="256" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" letter-spacing="2" fill="#f8fafc">LADYBUG</text>
  <text x="256" y="476" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="2" fill="#ecfccb">LINE ART</text>
</svg>
