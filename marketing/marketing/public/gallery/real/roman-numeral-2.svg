<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Roman numeral XII tattoo design">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#16213a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="18" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.9"/>
  <rect x="30" y="30" width="452" height="452" rx="12" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.35"/>
  <text x="256" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="3" fill="#818cf8" opacity="0.85">TATTOO MEANING</text>
  <circle cx="256" cy="280" r="150" fill="url(#glow)"/>
  <g stroke="#e0e7ff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- X -->
    <line x1="158" y1="208" x2="214" y2="368"/>
    <line x1="214" y1="208" x2="158" y2="368"/>
    <!-- I -->
    <line x1="262" y1="208" x2="262" y2="368"/>
    <!-- I -->
    <line x1="320" y1="208" x2="320" y2="368"/>
  </g>
  <text x="256" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" letter-spacing="2" fill="#f8fafc">ROMAN NUMERAL</text>
  <text x="256" y="466" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="3" fill="#c7d2fe">XII</text>
