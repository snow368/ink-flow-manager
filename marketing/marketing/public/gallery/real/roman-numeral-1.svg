<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Roman numeral IV tattoo design">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#16213a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="18" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.9"/>
  <rect x="30" y="30" width="452" height="452" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>
  <text x="256" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="3" fill="#fbbf24" opacity="0.85">TATTOO MEANING</text>
  <circle cx="256" cy="282" r="150" fill="url(#glow)"/>
  <!-- ink shadow underlay for depth -->
  <g stroke="#0b1120" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85">
    <line x1="196" y1="205" x2="196" y2="370"/>
    <line x1="178" y1="205" x2="214" y2="205"/>
    <line x1="178" y1="370" x2="214" y2="370"/>
    <line x1="288" y1="205" x2="338" y2="370"/>
    <line x1="392" y1="205" x2="338" y2="370"/>
  </g>
  <!-- gilded numeral -->
  <g stroke="url(#gold)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="196" y1="205" x2="196" y2="370"/>
    <line x1="178" y1="205" x2="214" y2="205"/>
    <line x1="178" y1="370" x2="214" y2="370"/>
    <line x1="288" y1="205" x2="338" y2="370"/>
    <line x1="392" y1="205" x2="338" y2="370"/>
  </g>
  <text x="256" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" letter-spacing="2" fill="#f8fafc">ROMAN NUMERAL</text>
  <text x="256" y="466" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="3" fill="#fcd34d">IV</text>
</svg>
